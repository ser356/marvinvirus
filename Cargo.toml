[workspace]
resolver = "2"
members = ["src-tauri", "helper"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/sergiogarciaseco/marvinvirus"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
walkdir = "2"
blake3 = "1"
rayon = "1"
trash = "5"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_Threading",
]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
